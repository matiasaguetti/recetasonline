<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recetas Saludables</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #ffffff;
      color: #333;
    }

    header {
      background-color: #f4f8f4;
      padding: 1rem 2rem;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      color: #2e7d32;
      margin: 0;
    }

    nav a {
      margin-left: 1rem;
      color: #2e7d32;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      text-align: center;
      padding: 2rem 1rem;
      background-color: #f9fff9;
    }

    .hero h2 {
      font-size: 2rem;
      color: #2e7d32;
      margin-bottom: 0.5rem;
    }

    .slideshow-container {
      position: relative;
      max-width: 900px;
      margin: 2rem auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .slide {
      display: none;
      text-align: center;
    }

    .slide img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
    }

    .slide h3 {
      margin: 0.5rem 0;
      color: #2e7d32;
    }

    .fade {
      animation: fade 1.5s ease-in-out;
    }

    @keyframes fade {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      overflow: auto;
    }

    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      border-radius: 10px;
      max-width: 600px;
      width: 90%;
      padding: 2rem; /* MARGEN INTERNO ADECUADO */
      box-sizing: border-box;
      text-align: left;
      line-height: 1.5;
    }

    .modal-content h3 {
      margin-top: 0;
      color: #2e7d32;
    }

    .close {
      color: #888;
      float: right;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: #2e7d32;
    }

    .btn-ver {
      display: inline-block;
      background-color: #2e7d32;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 500;
      margin-top: 1rem;
    }

    .btn-ver:hover {
      background-color: #256b29;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #f4f8f4;
      border-top: 1px solid #e0e0e0;
      color: #666;
    }

    @media (max-width: 600px) {
      .modal-content {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Recetas Saludables</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Recetas</a>
      <a href="#">Menús</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Comer sano nunca fue tan fácil</h2>
    <p>Explora nuestras recetas y menús saludables para cada día.</p>
  </section>

  <div class="slideshow-container">
    <div class="slide fade">
      <img src="https://source.unsplash.com/900x500/?salad" alt="Ensalada fresca" onclick="openModal('Ensalada fresca', 'Una ensalada nutritiva con hojas verdes, tomate cherry y aguacate.')">
      <h3>Ensalada fresca</h3>
    </div>
    <div class="slide fade">
      <img src="https://source.unsplash.com/900x500/?smoothie" alt="Smoothie energético" onclick="openModal('Smoothie energético', 'Batido de frutas y semillas para comenzar el día con energía.')">
      <h3>Smoothie energético</h3>
    </div>
    <div class="slide fade">
      <img src="https://source.unsplash.com/900x500/?bowl" alt="Bowl de quinoa" onclick="openModal('Bowl de quinoa', 'Una opción completa con proteínas vegetales y verduras frescas.')">
      <h3>Bowl de quinoa</h3>
    </div>
  </div>

  <div id="recipeModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle"></h3>
      <p id="modalDesc"></p>
      <a id="verRecetaBtn" href="#" class="btn-ver">Ver receta completa</a>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Recetas Saludables. Todos los derechos reservados.</p>
  </footer>

  <script>
    let slideIndex = 0;
    showSlides();

    function showSlides() {
      const slides = document.getElementsByClassName("slide");
      for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
      slideIndex++;
      if (slideIndex > slides.length) { slideIndex = 1 }
      slides[slideIndex - 1].style.display = "block";
      setTimeout(showSlides, 4000);
    }

    function openModal(title, desc) {
      document.getElementById("recipeModal").style.display = "block";
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalDesc").innerText = desc;
      document.getElementById("verRecetaBtn").href = `receta.html?nombre=${encodeURIComponent(title)}`;
    }

    function closeModal() {
      document.getElementById("recipeModal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("recipeModal");
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }
  </script>
</body>
</html>
